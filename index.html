<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Moved</title>
    
    <meta http-equiv="refresh" content="0; url=https://techynoob.com/">
    
    <script>
        window.location.replace("https://techynoob.com/");
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            text-align: center;
        }
        .message-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <div class="message-box">
        <h1>We Have Moved!</h1>
        <p>TechyNoob has a new home. You are being automatically redirected.</p>
        <p>If you are not redirected within a few seconds, please click the button below.</p>
        <a href="https://techynoob.com/">Visit Our New Website</a>
    </div>

</body>
</html>
